<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact · Zhuhan Bao</title>
  <meta name="description" content="Zhuhan Bao's calendar and contact links." />
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
</head>
<body>
<main class="page_wrap contact_wrap">
  <header class="site_header">
    <div class="header_inner">
      <div class="header_top">
        <h1 class="site_name contact_title"><a href="https://calendar.google.com/calendar/u/1?cid=emh1aGFuLmJhby5haUBnbWFpbC5jb20" target="_blank" rel="noopener noreferrer">Calendar</a></h1>
        <div class="header_buttons">
          <a href="../index.html" class="lang_btn" title="Back to homepage" aria-label="Back to homepage">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
          </a>
          <button id="theme_toggle" class="theme_btn" aria-label="Toggle theme">
            <svg class="theme_icon_sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
            <svg class="theme_icon_moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <section class="contact_calendar" aria-label="Calendar">
    <div class="calendar_frame">
      <iframe
        src="https://calendar.google.com/calendar/embed?height=600&amp;wkst=1&amp;ctz=Asia%2FSingapore&amp;hl=en&amp;src=emh1aGFuLmJhby5haUBnbWFpbC5jb20&amp;src=emgtY24uY2hpbmEjaG9saWRheUBncm91cC52LmNhbGVuZGFyLmdvb2dsZS5jb20&amp;color=%23039be5&amp;color=%234285f4"
        title="Zhuhan Bao calendar"
        width="800" height="600"></iframe>
    </div>
  </section>

  <nav class="contact_actions" aria-label="Contact links">
    <a class="contact_primary_link" href="https://zoom.us/meeting/schedule" target="_blank" rel="noopener noreferrer">Schedule in Zoom <span aria-hidden="true">↗</span></a>
    <a class="contact_secondary_link" href="mailto:zhuhan.bao.ai@gmail.com?subject=Zoom%20meeting%20invitation">Email me</a>
  </nav>
</main>

<script>
  const toggle = document.getElementById('theme_toggle');
  const html = document.documentElement;
  function setTheme(theme) {
    html.setAttribute('data-theme', theme);
    document.querySelector('.theme_icon_sun').style.display = theme === 'dark' ? 'none' : '';
    document.querySelector('.theme_icon_moon').style.display = theme === 'dark' ? '' : 'none';
    localStorage.setItem('theme', theme);
  }
  toggle.addEventListener('click', () => setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  const saved = localStorage.getItem('theme');
  if (saved) setTheme(saved);
</script>
</body>
</html>
